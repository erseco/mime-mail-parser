name: Tests

on: [push, pull_request]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    name: Quality checks

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none

      - name: Validate Composer configuration
        run: composer validate --strict

      - name: Install dependencies
        run: composer update --prefer-stable --prefer-dist --no-interaction --no-progress --quiet

      - name: Verify PSR-4 autoloading
        run: composer dump-autoload --optimize --strict-psr --quiet

      - name: Audit dependencies
        run: composer audit

      - name: Execute linter
        run: |
          composer lint > phpcs.log 2>&1 || {
            tail -n 100 phpcs.log
            exit 1
          }

      - name: Execute static analysis
        run: |
          composer analyse > phpstan.log 2>&1 || {
            tail -n 100 phpstan.log
            exit 1
          }

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.0', '8.1', '8.2', '8.3', '8.4', '8.5']

    name: PHP ${{ matrix.php }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Install dependencies
        run: composer update --prefer-stable --prefer-dist --no-interaction --no-progress --quiet

      - name: Execute Pest tests
        run: |
          composer test > pest.log 2>&1 || {
            tail -n 100 pest.log
            exit 1
          }

  lowest-dependencies:
    runs-on: ubuntu-latest
    name: PHP 8.0 - prefer-lowest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.0'
          coverage: none

      - name: Install lowest supported dependencies
        run: composer update --prefer-lowest --prefer-stable --prefer-dist --no-interaction --no-progress --quiet

      - name: Execute Pest tests
        run: |
          composer test > pest.log 2>&1 || {
            tail -n 100 pest.log
            exit 1
          }

  coverage:
    runs-on: ubuntu-latest
    name: Coverage

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: pcov

      - name: Install dependencies
        run: composer update --prefer-stable --prefer-dist --no-interaction --no-progress --quiet

      - name: Execute coverage with threshold
        run: |
          composer test-coverage > coverage.log 2>&1 || {
            tail -n 120 coverage.log
            exit 1
          }
          tail -n 40 coverage.log

      - name: Upload Clover report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-clover
          path: coverage/clover.xml
          if-no-files-found: error

  consumer:
    runs-on: ubuntu-latest
    name: Consumer installation

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Install production dependencies
        run: composer install --no-dev --prefer-dist --no-interaction --no-progress --quiet

      - name: Verify optimized autoloading
        run: composer dump-autoload --no-dev --optimize --strict-psr --quiet

      - name: Execute consumer smoke test
        run: |
          php -r '
          require "vendor/autoload.php";
          $message = Erseco\Message::fromString("Subject: Smoke test\r\nContent-Type: text/plain\r\n\r\nBody");
          if ($message->getSubject() !== "Smoke test") {
              fwrite(STDERR, "Unexpected subject\n");
              exit(1);
          }
          if ($message->getTextPart()?->getContent() !== "Body") {
              fwrite(STDERR, "Unexpected body\n");
              exit(1);
          }
          '
